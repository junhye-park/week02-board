<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>분석 기록 수정 | 사기시그널</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="{{ url_for('index') }}" class="logo">
                사기시그널
            </a>

            <a href="{{ url_for('index') }}"
               class="button button-outline">
                분석 기록
            </a>
        </div>
    </header>

    <main class="form-page">
        {% if report %}
        <!-- 수정 안내 -->
        <section class="form-introduction">
            <h1>분석 기록 수정</h1>

            <p>
                메시지 내용을 수정하면 위험 키워드와 위험점수가
                다시 계산됩니다.
            </p>

            <div class="current-result">
                <span>현재 분석 결과</span>

                <div>
                    <strong>{{ report.risk_score }}점</strong>

                    <span class="risk-badge
                        {% if report.risk_level == '위험' %}
                            badge-danger
                        {% elif report.risk_level == '주의' %}
                            badge-warning
                        {% else %}
                            badge-safe
                        {% endif %}
                    ">
                        {{ report.risk_level }}
                    </span>
                </div>
            </div>
        </section>

        <!-- 수정 입력 폼 -->
        <section class="analysis-panel">
            <h2>내용 수정</h2>

            <form method="POST" class="analysis-form">
                <div class="form-group">
                    <label for="scam_type">의심 유형</label>

                    <select
                        id="scam_type"
                        name="scam_type"
                        required
                    >
                        <option value="스미싱"
                            {% if report.scam_type == '스미싱' %}selected{% endif %}>
                            스미싱
                        </option>

                        <option value="보이스피싱"
                            {% if report.scam_type == '보이스피싱' %}selected{% endif %}>
                            보이스피싱
                        </option>

                        <option value="투자사기"
                            {% if report.scam_type == '투자사기' %}selected{% endif %}>
                            투자사기
                        </option>

                        <option value="중고거래 사기"
                            {% if report.scam_type == '중고거래 사기' %}selected{% endif %}>
                            중고거래 사기
                        </option>

                        <option value="기타"
                            {% if report.scam_type == '기타' %}selected{% endif %}>
                            기타
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="message">메시지 내용</label>
                        <span id="characterCount">0자</span>
                    </div>

                    <textarea
                        id="message"
                        name="message"
                        rows="11"
                        maxlength="3000"
                        required
                    >{{ report.message }}</textarea>
                </div>

                <div class="form-group">
                    <label for="memo">
                        메모
                        <span class="optional">선택사항</span>
                    </label>

                    <textarea
                        id="memo"
                        name="memo"
                        rows="4"
                        maxlength="1000"
                    >{{ report.memo or '' }}</textarea>
                </div>

                <div class="privacy-message">
                    <strong>수정된 내용은 다시 분석됩니다.</strong>
                    <p>
                        저장하면 새로운 메시지를 기준으로 위험점수,
                        등급과 발견된 키워드가 변경됩니다.
                    </p>
                </div>

                <div class="button-group">
                    <a
                        href="{{ url_for('detail', report_id=report.id) }}"
                        class="button button-outline"
                    >
                        취소
                    </a>

                    <button type="submit" class="button">
                        수정 완료
                    </button>
                </div>
            </form>
        </section>

        {% else %}
        <section class="empty">
            <h1>수정할 기록을 찾을 수 없습니다.</h1>

            <a href="{{ url_for('index') }}">
                목록으로 돌아가기
            </a>
        </section>
        {% endif %}
    </main>

    <footer>
        사기시그널 · 금융사기 위험 분석 프로젝트
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
